<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Prism Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,520;9..144,620&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #100f0d;
      --rail: #0c0b0a;
      --surface: #181714;
      --surface-2: #211f1b;
      --line: rgba(243, 239, 230, 0.09);
      --line-strong: rgba(243, 239, 230, 0.16);
      --text: #f3efe6;
      --muted: #a8a295;
      --faint: #746e64;
      --accent: #d4c4ff;
      --good: #9ed9bc;
      --warn: #e4c48a;
      --bad: #f0a090;
      --serif: "Fraunces", Georgia, serif;
      --sans: "DM Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(212, 196, 255, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14.5px;
      line-height: 1.45;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.42; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent); color: #1a1428; }
    code, .mono { font-family: var(--mono); font-size: 12.5px; }
    h1, h2, p { margin: 0; }
    .app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 14px 18px;
      background: var(--rail);
      border-right: 1px solid var(--line);
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 0 8px; }
    .brand strong { display: block; font-family: var(--serif); font-weight: 520; font-size: 22px; letter-spacing: -0.03em; line-height: 1; }
    .brand span { color: var(--faint); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    nav { display: flex; flex-direction: column; gap: 4px; margin-top: 32px; }
    nav button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 10px;
    }
    nav button svg { flex: none; opacity: 0.8; }
    nav button[aria-current="page"] { background: var(--surface-2); color: var(--text); }
    nav button:hover:not([aria-current="page"]) { color: var(--text); }
    .rail-foot { margin-top: auto; padding: 0 10px; color: var(--faint); font-size: 12px; line-height: 1.5; }
    .workspace { padding: 26px 36px 72px; }
    .workspace-inner { max-width: 1120px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 26px;
    }
    .eyebrow { color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    h1 { font-family: var(--serif); font-weight: 520; font-size: 40px; letter-spacing: -0.035em; line-height: 1.05; margin-top: 6px; }
    .lede { color: var(--muted); margin-top: 8px; }
    .top-tools { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .chip {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .viewing { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .viewing p { color: var(--faint); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .switch { display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
    .switch button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
    .switch button[aria-pressed="true"] { background: var(--text); color: #16140f; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .kpi, .panel, .card, .receipt, .install {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    .kpi { padding: 16px 18px 18px; }
    .kpi .label, .panel h2, .card h2, .install h2 {
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .kpi .value { font-family: var(--serif); font-size: 36px; font-weight: 520; letter-spacing: -0.04em; margin-top: 12px; font-variant-numeric: tabular-nums; line-height: 1; }
    .kpi .value.warn { color: var(--warn); }
    .kpi .value.bad { color: var(--bad); }
    .kpi .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
    .up { color: var(--good); }
    .down { color: var(--bad); }
    .chart { width: 100%; height: 220px; display: block; }
    .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .legend-row { display: flex; gap: 16px; margin-bottom: 8px; color: var(--muted); font-size: 12.5px; }
    .legend-row i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 6px; }
    .table-wrap { overflow-x: auto; }
    .layout { display: grid; gap: 12px; margin-top: 12px; }
    .two { grid-template-columns: 1.3fr 0.7fr; }
    .split { grid-template-columns: 1fr 1fr; }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel, .install { padding: 18px 18px 16px; }
    .panel h2, .install h2 { margin-bottom: 14px; }
    .stack { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .stack span { display: block; height: 100%; }
    .c0 { background: #d4c4ff; }
    .c1 { background: #8f82b8; }
    .c2 { background: #6d6558; }
    .c3 { background: #463f36; }
    .c4 { background: #2c2924; }
    .s-ok { background: var(--good); }
    .s-warn { background: var(--warn); }
    .s-bad { background: var(--bad); }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
    .legend div { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
    .swatch { width: 8px; height: 8px; border-radius: 99px; }
    .bars { display: flex; flex-direction: column; gap: 12px; }
    .bar-meta, .route-line { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .bar-meta span, .num { font-variant-numeric: tabular-nums; color: var(--muted); }
    .track { margin-top: 6px; height: 4px; border-radius: 99px; background: #2a2723; }
    .fill { height: 100%; border-radius: 99px; background: var(--accent); }
    .project {
      position: relative;
      overflow: hidden;
      padding: 18px 18px 16px;
    }
    .project::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; }
    .project.lavender::before { background: var(--accent); }
    .project.coral::before { background: var(--bad); }
    .project .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .project .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin-top: 16px; }
    .project .stats strong { display: block; font-family: var(--serif); font-size: 26px; font-weight: 520; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .project .stats span, .quiet { color: var(--muted); font-size: 12.5px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
    .dot.lavender { background: var(--accent); }
    .dot.coral { background: var(--bad); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .filters button, .ghost {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 11px;
    }
    .filters button[aria-pressed="true"] { background: var(--text); color: #16140f; border-color: var(--text); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 11px 12px 11px 0; vertical-align: middle; }
    th { color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
    th button { border: 0; background: transparent; color: inherit; letter-spacing: inherit; text-transform: inherit; font-size: inherit; font-weight: inherit; padding: 0; }
    th button[aria-pressed="true"] { color: var(--text); }
    td { border-top: 1px solid var(--line); }
    tr:hover td { background: rgba(243, 239, 230, 0.02); }
    .pill { display: inline-flex; min-width: 44px; justify-content: center; border-radius: 999px; padding: 2px 8px; font-variant-numeric: tabular-nums; font-size: 12px; }
    .pill.ok { color: var(--good); background: rgba(158, 217, 188, 0.12); }
    .pill.warn { color: var(--warn); background: rgba(228, 196, 138, 0.12); }
    .pill.bad { color: var(--bad); background: rgba(240, 160, 144, 0.14); }
    .who { display: inline-flex; align-items: center; gap: 8px; }
    .card {
      text-align: left;
      padding: 16px;
      width: 100%;
    }
    .card strong { display: block; margin: 8px 0 6px; font-weight: 600; }
    .card span, .install p { color: var(--muted); }
    .card:hover:not(:disabled) { border-color: rgba(212, 196, 255, 0.45); }
    .receipt { margin-top: 12px; padding: 16px 18px; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 16px; }
    .receipt.ok { background: rgba(158, 217, 188, 0.06); }
    .receipt.blocked { background: rgba(212, 196, 255, 0.07); }
    .receipt.bad { background: rgba(240, 160, 144, 0.08); }
    .receipt dt { color: var(--faint); }
    .receipt dd { margin: 0; }
    .install { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; }
    .install pre {
      grid-column: 1 / -1;
      margin: 8px 0 0;
      padding: 12px 14px;
      overflow: auto;
      background: #100f0d;
      border-radius: 12px;
      color: #e7e1d6;
      line-height: 1.55;
    }
    .empty { color: var(--muted); padding: 8px 0 12px; }
    .caption { color: var(--faint); font-size: 12.5px; margin-top: 12px; }
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .gate form { width: min(420px, 100%); padding: 22px; }
    .gate h1 { font-size: 32px; }
    .gate input {
      width: 100%;
      margin: 16px 0 10px;
      border: 1px solid var(--line-strong);
      background: #100f0d;
      border-radius: 12px;
      padding: 12px 14px;
    }
    .gate button { width: 100%; border: 0; border-radius: 12px; padding: 11px 14px; background: var(--text); color: #16140f; }
    .enter { animation: rise 220ms ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav { flex-direction: row; overflow: auto; margin-top: 16px; }
      .rail-foot { display: none; }
      .kpis, .two, .split { grid-template-columns: 1fr 1fr; }
      .top { align-items: flex-start; flex-direction: column; }
      .viewing { align-items: flex-start; }
    }
    @media (max-width: 680px) {
      .workspace { padding: 20px 16px 48px; }
      h1 { font-size: 32px; }
      .kpis, .two, .split, .three, .receipt, .install { grid-template-columns: 1fr; }
      .install pre { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <form class="panel">
      <p class="eyebrow">Web and API analytics</p>
      <h1>Open a project</h1>
      <p class="lede">Paste a project or operator token.</p>
      <input id="token" name="token" autocomplete="off" placeholder="Token" />
      <button type="submit">Open</button>
      <p id="gate-error" class="caption"></p>
    </form>
  </div>
  <div id="app" class="app" hidden>
    <aside>
      <div class="brand">

          <path d="M12 3.2 12 20.2" stroke="#f0a090" stroke-width="1.3" />

          <strong>Prism</strong>

        <button type="button" data-view="compare" id="nav-compare">Compare</button>
      </nav>
      <p class="rail-foot">No cookies. Span and log bodies are dropped on ingest. A project cannot read another project.</p>
    </aside>
    <div class="workspace">
      <div class="workspace-inner">
        <header class="top">
          <div>
            <p class="eyebrow">Web and API analytics</p>
            <h1 id="title">Prism</h1>
            <p id="lede" class="lede"></p>
          </div>
          <div class="top-tools">
            <div class="viewing">
              <p>Range</p>
              <div id="range" class="switch" role="group" aria-label="Time range"></div>
            </div>
            <div class="viewing">
              <p>Viewing</p>
              <div id="switcher" class="switch" role="group" aria-label="Viewing"></div>
            </div>
          </div>
        </header>
        <div id="stage"></div>
      </div>

  </div>
  <script type="module">
const ACCOUNT = 'G' + 'A'.repeat(55);
const RANGES = ['24h', '7d', '30d', '90d'];

const SCALE = { '24h': 0.034, '7d': 0.22, '30d': 1, '90d': 2.85 };

const state = {
  token: '', role: '', tenantId: '', roster: null, view: 'overview', range: '30d',
  status: 'all', project: 'all', sort: 'requests', receipt: null, busy: false, painted: '',
  extra: { alpha: { views: 0, paths: {}, api: {} }, beta: { views: 0, paths: {}, api: {} } },
};

const stage = document.querySelector('#stage');
const title = document.querySelector('#title');
const lede = document.querySelector('#lede');
let chartSeq = 0;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}
function num(value) { return Number(value || 0).toLocaleString('en'); }
function pct(value) { return (value * 100).toFixed(1) + '%'; }
function duration(seconds) {
  const rounded = Math.max(0, Math.round(seconds));
  const minutes = Math.floor(rounded / 60);
  const rest = rounded % 60;
  return minutes ? minutes + 'm ' + String(rest).padStart(2, '0') + 's' : rest + 's';
}
function ms(value) {
  if (value == null) return '—';
  return value >= 1000 ? (value / 1000).toLocaleString('en', { maximumFractionDigits: 1 }) + ' s' : value + ' ms';
}
function nameOf(id) { return PROFILES[id]?.name ?? id; }
function hueOf(id) { return PROFILES[id]?.hue ?? 'lavender'; }
function headers() { return { authorization: 'Bearer ' + state.token, 'content-type': 'application/json' }; }
function tone(code) { return code >= 500 ? 'bad' : code >= 400 ? 'warn' : 'ok'; }
function sum(rows, pick) { return rows.reduce((total, row) => total + pick(row), 0); }
function seedOf(id, salt) {
  let hash = (id === 'alpha' ? 101 : 307) + salt * 17 + state.range.length * 13;
  return hash >>> 0;
}
function wave(seed, count, total) {
  let value = seed >>> 0;
  const next = () => {
    value = (value + 0x6D2B79F5) >>> 0;
    let t = Math.imul(value ^ (value >>> 15), 1 | value);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const raw = [];
  for (let index = 0; index < count; index += 1) {
    const cycle = 0.72 + 0.38 * Math.sin((index / count) * Math.PI * (count > 12 ? 6 : 2));
    raw.push(cycle * (0.65 + next() * 0.7));
  }
  const weight = raw.reduce((total, item) => total + item, 0) || 1;
  const points = raw.map((item) => Math.max(0, Math.round((item / weight) * total)));
  const drift = total - points.reduce((total, item) => total + item, 0);
  points[points.length - 1] += drift;
  return points;

              traceId: 'not-stored',
              startTimeUnixNano: '0',
              endTimeUnixNano: '80000000',
              attributes: [
                { key: 'http.route', value: { stringValue: route } },
                { key: 'http.response.status_code', value: { intValue: 200 } },
              ],
            }] }],
          }],
          resourceLogs: [{ scopeLogs: [{ logRecords: [{ body: { stringValue: 'card number was here' } }] }] }],
        }),
      });
      const body = await response.json();
      if (response.ok) {
        const extra = state.extra[state.tenantId];
        const key = 'payments|/accounts/:account/payments/:id|200';
        extra.api[key] = (extra.api[key] || 0) + 1;
        state.receipt = { tone: 'ok', title: 'Request counted', rows: [['Kept', body.retained || 'route, status, latency'], ['Dropped', body.droppedSpans + ' span, ' + body.droppedLogs + ' log'], ['Not returned', 'trace id and log line']] };
      } else {
        state.receipt = { tone: 'bad', title: 'Request rejected', rows: [['Reason', body.error || String(response.status)]] };
      }
    } else if (action === 'peek') {
      const other = state.tenantId === 'beta' ? 'alpha' : 'beta';
      const response = await fetch('/metrics/api?tenant=' + other, { headers: headers() });
      const body = await response.json();
      state.receipt = response.status === 403
        ? { tone: 'blocked', title: 'Refused, as designed', rows: [['Asked for', nameOf(other)], ['Response', '403'], ['Meaning', body.error || 'a project cannot read another project']] }
        : { tone: 'bad', title: 'Isolation failed', rows: [['Response', String(response.status)]] };
    }
  } catch (error) {
    state.receipt = { tone: 'bad', title: 'Request failed', rows: [['Reason', error instanceof Error ? error.message : 'error']] };
  } finally {
    state.busy = false;
    render();
  }
}

document.querySelector('#nav').addEventListener('click', (event) => {
  const button = event.target.closest('[data-view]');
  if (!button || button.hidden) return;
  state.view = button.dataset.view;
  render();
});
stage.addEventListener('click', async (event) => {
  const action = event.target.closest('[data-action]');
  const filter = event.target.closest('[data-filter]');
  const sort = event.target.closest('[data-sort]');
  if (filter) {
    state[filter.dataset.filter] = filter.dataset.value;
    render();
    return;
  }
  if (sort) {
    state.sort = sort.dataset.sort;
    render();
    return;
  }
  if (!action || action.disabled) return;
  if (action.dataset.action === 'compare') {
    state.view = 'compare';
    render();
    return;
  }
  if (action.dataset.action === 'copy') {
    try {
      await navigator.clipboard.writeText(SNIPPET);
      action.textContent = 'Copied';
    } catch {
      action.textContent = 'Select the tag';
    }
    setTimeout(() => { action.textContent = 'Copy'; }, 1200);
    return;
  }
  await run(action.dataset.action);
});
document.querySelector('#gate form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const token = document.querySelector('#token').value.trim();
  const probe = await fetch('/metrics/web?all=1', { headers: { authorization: 'Bearer ' + token } });
  if (probe.status === 401) {
    document.querySelector('#gate-error').textContent = 'Unknown token.';
    return;
  }
  state.roster = state.roster ?? { tenants: [] };
  if (!state.switchReady) buildSwitcher();
  if (probe.ok) selectRole('operator', token, '');
  else selectRole('token', token, '');
});

buildRange();
const roster = await fetch('/demo/roster');
if (roster.ok) {
  state.roster = await roster.json();
  state.switchReady = true;
  buildSwitcher();
  const first = state.roster.tenants[0];
  selectRole(first.id, first.token, first.id);
} else {
  document.querySelector('#gate').hidden = false;
}

  </script>
</body>
</html>
